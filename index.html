<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firth of Forth — Interactive Port Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.control.layers.tree@1.1.0/L.Control.Layers.Tree.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-hash/0.2.1/leaflet-hash.min.js"></script>


<style>
  /* ==========================================================================
     1. GLOBAL VARIABLE DEFINITIONS & CSS RESET
     ========================================================================== */
  :root {
    --navy: #0b1c2c;
    --navy-2: #12283d;
    --sea: #1a4a6e;
    --teal: #2a9d8f;
    --gold: #f5ae05;
    --sand: #f4e8c8;
    --foam: #e8f4f8;
    --ink: #0d1b26;
    --muted: #8aa0b3;
    --card: rgba(11, 28, 44, 0.92);
    --pin: #de4b26;
    --club: #1c8db0;
    --event: #c77dff;
    --ntm: #de681f;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  html, body { 
    height: 100%; 
  }

  body {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    background: var(--navy);
    color: var(--foam);
    overflow: hidden;
  }

  /* ==========================================================================
     2. DESKTOP / DEFAULT WIREFRAME LAYOUTS
     ========================================================================== */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: linear-gradient(180deg, rgba(11,28,44,0.92) 0%, rgba(11,28,44,0.55) 70%, transparent 100%);
    pointer-events: none;
  }
  header * { pointer-events: auto; }

  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; color: #fff; }
  .brand span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .toolbar { 
    display: flex; 
    gap: 8px; 
    align-items: center; 
    flex-wrap: wrap; 
    justify-content: flex-end; 
  }
  .toolbar button, .search {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--foam);
    border-radius: 8px;
    padding: 8px 12px;
    font: 500 13px "IBM Plex Sans", sans-serif;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .toolbar button:hover { background: rgba(255,255,255,0.16); border-color: var(--gold); }
  .toolbar button.active-tool { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  
  .search { width: 200px; outline: none; }
  .search:focus { border-color: var(--teal); }

  .filters {
    display: flex;
    gap: 6px;
    position: absolute;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    background: rgba(11,28,44,0.82);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 5px;
    border-radius: 999px;
    backdrop-filter: blur(10px);
  }
  .filters button {
    border: 0; background: transparent; color: var(--foam);
    font: 600 12px "IBM Plex Sans", sans-serif;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .filters button.active { background: var(--gold); color: var(--ink); }

  #map {
    position: absolute; inset: 0;
    z-index: 1;
    background: #0a2233;
  }

  /* Hide mobile trigger buttons on desktop configurations */
  #mobileFilters,
  #mobileLayers,
  #mobileInfo,
  #mobileList {
    display: none;
  }

  /* ==========================================================================
     3. OVERLAY PANELS & INTERACTIVE COMPONENTS (DESKTOP)
     ========================================================================== */
  .list-panel {
    position: absolute;
    top: 72px; left: 16px;
    width: 250px;
    max-height: calc(100vh - 96px);
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    z-index: 2000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .list-panel h3 {
    padding: 14px 16px 8px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .port-list { overflow-y: auto; padding: 0 8px 12px; }
  .port-list button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    color: var(--foam);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font: 500 13px "IBM Plex Sans", sans-serif;
  }
  .port-list button:hover, .port-list button.active { background: rgba(255,255,255,0.08); }
  .port-list .tag {
    font: 600 10px "IBM Plex Mono", monospace;
    letter-spacing: 0.06em;
    color: var(--gold);
  }

  .group-label {
    font: 600 10px "IBM Plex Mono", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 10px 4px;
  }

  .panel {
    position: absolute;
    top: 72px; right: 16px;
    width: 380px;
    max-height: calc(100vh - 110px);
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    z-index: 2100;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .panel.open { display: flex; }
  
  .panel-head {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 16px 16px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .panel-head h2 { font-size: 18px; }
  .panel-head .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .panel-head .close {
    background: transparent; border: 0; color: var(--foam);
    font-size: 22px; cursor: pointer; line-height: 1;
  }

  .panel-body { overflow-y: auto; padding: 14px 16px 20px; font-size: 14px; line-height: 1.55; }
  .panel-body p { margin-bottom: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    background: rgba(42,157,143,0.18);
    border: 1px solid rgba(42,157,143,0.4);
    color: #9ee7dc;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
  }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .fact {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .fact dt { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .fact dd { font-size: 13px; margin-top: 2px; }

  .why-banner {
    background: rgba(233,196,106,0.12);
    border: 1px solid rgba(233,196,106,0.35);
    color: var(--sand);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .links a { color: var(--gold); }

  /* ==========================================================================
     4. MAP ATTRIBUTIONS & ELEMENT DECORATIONS
     ========================================================================== */
  .leaflet-control-attribution {
    background: rgba(11,28,44,0.8) !important;
    color: #8aa0b3 !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: var(--gold) !important; }
  
  .leaflet-control-layers {
    background: rgba(11, 28, 44, 0.92) !important;
    color: var(--foam) !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-radius: 10px !important;
    z-index: 6000 !important;
  }
  .leaflet-control-layers label { font: 12px "IBM Plex Sans", sans-serif; }
  .leaflet-bar a {
    background: rgba(11,28,44,0.92) !important;
    color: var(--foam) !important;
    border-bottom-color: rgba(255,255,255,0.12) !important;
  }

  .legend {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    background: rgba(11,28,44,0.82);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 11px;
    display: flex; gap: 12px; flex-wrap: wrap;
    max-width: calc(100vw - 320px);
  }
  .legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 5px; vertical-align: -1px;
  }
  .legend i.sq { border-radius: 2px; }

  .hint {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
    display: block;
  }

  /* Marker Pins styling */
  .mk { background: transparent; border: 0; }
  .mk .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--pin);
    border: 2px solid #fff;
    box-shadow: 0 0 0 6px rgba(231,111,81,0.25);
  }
  .mk.major .dot { background: var(--gold); box-shadow: 0 0 0 6px rgba(233,196,106,0.28); }
  .mk.club .dot { background: var(--club); box-shadow: 0 0 0 6px rgba(76,201,240,0.28); }
  .mk.event .dot { background: var(--event); border-radius: 3px; box-shadow: 0 0 0 6px rgba(199,125,255,0.28); }
  .mk.ntm .dot { background: var(--ntm); border-radius: 3px; box-shadow: 0 0 0 6px rgba(244,162,97,0.28); }
  .mk.active .dot { transform: scale(1.25); }

  .leaflet-tooltip.pin-label {
    background: rgba(11,28,44,0.88);
    border: 0;
    color: #fff;
    font: 600 11px "IBM Plex Sans", sans-serif;
    box-shadow: none;
    padding: 2px 6px;
  }
  .leaflet-tooltip.pin-label::before { display: none; }

  /* ==========================================================================
     5. RESPONSIVE MOBILE OVERRIDES (STRICT MEDIA QUERY ROOT)
     ========================================================================== */
  @media (max-width: 768px) {
    /* Reveal structural touch UI buttons */
    #mobileFilters, #mobileList {
      display: inline-block;
    }

    /* Hide standard desktop elements cleanly */
    #filters, #listPanel, #panel, .legend, .hint {
      display: none !important;
    }

    /* Re-orient stacked header elements safely */
    header {
      position: absolute;
      flex-direction: column;
      align-items: stretch;
      padding: 8px;
      gap: 6px;
      background: rgba(11,28,44,0.98);
      pointer-events: none; 
    }
    header * { 
      pointer-events: auto; 
    }

    .brand {
      text-align: center;
      margin-bottom: 2px;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
    }

    .search {
      width: 100%;
      max-width: 100%;
      height: 38px;
    }

    #filters.mobile-open {
      display: flex !important;
      flex-wrap: wrap;
      gap: 6px;
      position: fixed;
      left: 12px;
      right: 12px;
      top: 130px;
      height: auto;
      max-height: 45vh;
      overflow-y: auto;
      background: rgba(11, 28, 44, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transform: none;
    }
    #filters.mobile-open button {
      flex: 1 1 calc(50% - 6px);
      min-height: 36px;
    }

    /* LIST PANEL: Kept as a clean bottom drawer */
    #listPanel.mobile-open {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      left: 0; right: 0; bottom: 0; top: auto;
      height: 45vh;
      max-height: 45%;
      z-index: 9998;
      background: #0b1c2c;
      border-top: 1px solid rgba(255,255,255,0.15);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.6);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* FIX: Centered Modal Overlay Layout for Cards & Details */
    #panel.mobile-open {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      left: 50%;
      top: 50%;
      bottom: auto;
      right: auto;
      transform: translate(-50%, -50%);
      width: calc(100vw - 32px); 
      max-width: 420px;
      height: 70vh;
      max-height: 70%;
      z-index: 9999;
      background: #0b1c2c;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }


  /* Prevent menu clipping & reserve safe header space for absolute floating cross button */
  .leaflet-control-layers-expanded {
    position: relative !important;
    max-width: calc(100vw - 32px) !important;
    max-height: 50vh !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    margin-right: 12px !important;
    margin-bottom: 12px !important;
    padding-top: 38px !important; 
    border-radius: 12px !important;
  }


  /* Dedicated Touch Close Control Styling */
  .mobile-layer-close {
    display: none; /* Hide by default so it never blocks the small circle button */
    position: absolute;
    top: 6px;
    right: 8px;
    z-index: 7000;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--foam);
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Only reveal the close button when the Leaflet layers panel is explicitly expanded */
  .leaflet-control-layers-expanded .mobile-layer-close {
    display: flex;
  }


  .panel-body, .port-list {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px 24px;
  }
}


</style>

</head>
<body>
  <div id="map"></div>
  <header>
    <div class="brand">
      <h1>Firth of Forth</h1>
      <span>Berths · races · Notices to Mariners</span>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Find a port, club or race…" />
      <button id="whyBtn" type="button">Why this exists</button>
      <button id="toggleLabels" type="button">Labels</button>
      <button id="reset" type="button">Reset</button>
      <button id="mobileFilters" type="button">Filters</button>
      <button id="mobileList" type="button">List</button>
    </div>
  </header>

  <div class="filters" id="filters">
    <button data-filter="all" class="active" type="button">All</button>
    <button data-filter="port" type="button">Ports</button>
    <button data-filter="club" type="button">Clubs</button>
    <button data-filter="event" type="button">Races &amp; events</button>
    <button data-filter="visitor" type="button">Visitor berths</button>
    <button data-filter="ntm" type="button">Notices to Mariners</button>
  </div>

  <aside class="list-panel" id="listPanel">
    <h3>On this chart</h3>
    <div class="port-list" id="portList"></div>
  </aside>

  <aside class="panel" id="panel">
    <div class="panel-head">
      <div>
        <h2 id="pTitle">Port</h2>
        <div class="meta" id="pMeta"></div>
      </div>
      <button class="close" id="closePanel" aria-label="Close">×</button>
    </div>
    <div class="panel-body" id="pBody"></div>
  </aside>

  
  <div class="hint">OpenSeaMap seamarks on OSM / ocean tiles — filter berths, races or NtMs, then click a pin</div>
  <div class="legend">
    <div><i style="background:#e9c46a"></i> Major commercial port</div>
    <div><i style="background:#e76f51"></i> Harbour / terminal</div>
    <div><i style="background:#4cc9f0"></i> Yacht club</div>
    <div><i class="sq" style="background:#c77dff"></i> Race / event</div>
    <div><i class="sq" style="background:#f4a261"></i> Notice to Mariners</div>
  </div>



  <script>
    let ports = [];
    let activeFilter = "all";
    let showLabels = false;
const markers = {};

    const panel = document.getElementById("panel");
    const pTitle = document.getElementById("pTitle");
    const pMeta = document.getElementById("pMeta");
    const pBody = document.getElementById("pBody");
    const portList = document.getElementById("portList");
    const forthBounds = L.latLngBounds([55.93, -3.85], [56.28, -2.40]);
// Initialize the map object without assigning an initial view immediately
const map = L.map("map", {
  zoomControl: true,
  minZoom: 8,
  maxZoom: 18,
  worldCopyJump: false
});

// Vessel layer
const vesselLayer = L.layerGroup().addTo(map);

// Activate the hash plugin first so it can read the URL if one exists
const hash = new L.Hash(map);

// Check if the URL ALREADY has a hash. If it doesn't, apply your default bounds fallback
if (!window.location.hash) {
  map.fitBounds(forthBounds, { padding: [40, 40] });
}

    // Paste the CARTO Basemaps key from carto.com/basemaps/apikey here.
    const CARTO_KEY = "cb1_3rm4_1_8e53e833c39c0732f50e36e9";

    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap'
    });
    const voyager = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=" + encodeURIComponent(CARTO_KEY), {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 20
    });
    const ocean = L.tileLayer("https://services.arcgisonline.com/arcgis/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Esri Ocean / GEBCO"
    });




	const imagery = L.tileLayer(
	'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
	{
	attribution: 'Esri World Imagery; <a href="https://carto.com/attributions">CARTO</a> labels'
	});





const cartoLabels = L.tileLayer(
   'https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png?key=' + encodeURIComponent(CARTO_KEY),
  {
    subdomains: 'abcd',
    maxZoom: 20
  }
);


const esriHybrid = L.layerGroup([
    imagery,
    cartoLabels
]);

esriHybrid.addTo(map);


    const seaMarks = L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openseamap.org/" target="_blank" rel="noopener">OpenSeaMap</a>',
      opacity: 0.95
    });


const sepaDynamicLayer = L.tileLayer.wms(
  "https://map.sepa.org.uk/server/services/Open/Environmental_Monitoring/MapServer/WMSServer",
  {
    layers: "0",
    format: "image/png",
    transparent: true,
    version: "1.3.0",
    attribution: "© SEPA"
  }
);

let activeSepaSublayers = [];


sepaDynamicLayer.addTo(map);
sepaDynamicLayer.setOpacity(0);


function updateSepaLayerString() {
  if (activeSepaSublayers.length === 0) {
    sepaDynamicLayer.setOpacity(0);
    sepaDynamicLayer.setParams({ layers: "999" });
  } else {
    sepaDynamicLayer.setOpacity(1);
    sepaDynamicLayer.setParams({
      layers: activeSepaSublayers.join(",")
    });
  }
}

const sepaPoints = L.layerGroup().on("add", () => {
    if (!activeSepaSublayers.includes("2")) activeSepaSublayers.push("2");
    updateSepaLayerString();
    sepaDynamicLayer.redraw(); 
}).on("remove", () => {
    activeSepaSublayers = activeSepaSublayers.filter(id => id !== "2");
    updateSepaLayerString();
    sepaDynamicLayer.redraw(); 
});

const sepaPolygons = L.layerGroup().on("add", () => {
    if (!activeSepaSublayers.includes("1")) activeSepaSublayers.push("1");
    updateSepaLayerString();
    sepaDynamicLayer.redraw();
}).on("remove", () => {
    activeSepaSublayers = activeSepaSublayers.filter(id => id !== "1");
    updateSepaLayerString();
    sepaDynamicLayer.redraw();
});

const sepaZones = L.layerGroup().on("add", () => {
    if (!activeSepaSublayers.includes("3")) activeSepaSublayers.push("3");
    updateSepaLayerString();
    sepaDynamicLayer.redraw();
}).on("remove", () => {
    activeSepaSublayers = activeSepaSublayers.filter(id => id !== "3");
    updateSepaLayerString();
    sepaDynamicLayer.redraw();
});

const sepaSignage = L.layerGroup().on("add", () => {
    if (!activeSepaSublayers.includes("4")) activeSepaSublayers.push("4");
    updateSepaLayerString();
    sepaDynamicLayer.redraw();
}).on("remove", () => {
    activeSepaSublayers = activeSepaSublayers.filter(id => id !== "4");
    updateSepaLayerString();
    sepaDynamicLayer.redraw();
});




	const mpa = L.tileLayer.wms(
  "https://ogc.nature.scot/geoserver/protectedareas/ows",
  {
    layers: "protectedareas:mpa",
    format: "image/png",
    transparent: true,
    version: "1.3.0",
    attribution: "NatureScot"
  }
);


	const spa = L.tileLayer.wms(
  "https://ogc.nature.scot/geoserver/protectedareas/ows",
  {
    layers: "protectedareas:spa",
    format: "image/png",
    transparent: true,
    version: "1.3.0",
    attribution: "NatureScot"
  }
);


	const sac = L.tileLayer.wms(
  "https://ogc.nature.scot/geoserver/protectedareas/ows",

function attachMobileLayerClose() {
    const container = layerControl.getContainer();
    if (!container) return;

    function handleExpand() {
        // 1. If the container is expanded on mobile, inject the close button
        if (window.innerWidth <= 768 && container.classList.contains('leaflet-control-layers-expanded')) {
            if (!container.querySelector('.mobile-layer-close')) {
                const closeBtn = document.createElement('button');
                closeBtn.type = 'button';
                closeBtn.className = 'mobile-layer-close';
                closeBtn.innerHTML = '×';
                closeBtn.ariaLabel = 'Close layer panel';

                // Explicit touch handling isolation
                closeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); 
                    layerControl.collapse();
                    handleExpand(); // Refresh state upon programmatic collapse
                });
                
                closeBtn.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                }, { passive: true });

                container.appendChild(closeBtn);
            }
        } 
        // 2. Safely remove the button ONLY when we confirm the container is collapsed
        else if (!container.classList.contains('leaflet-control-layers-expanded')) {
            const existingBtn = container.querySelector('.mobile-layer-close');
            if (existingBtn) {
                existingBtn.remove();
            }
        }
    }

    // Rely strictly on panel structural changes rather than intercepting map dataset additions
    map.on('collapseLayers', handleExpand);
    map.on('overlayadd', handleExpand);
    map.on('overlayremove', handleExpand);
    map.on('baselayerchange', handleExpand);
    
    // Track explicit interactions on the container element itself
    container.addEventListener('click', () => setTimeout(handleExpand, 50));
    container.addEventListener('touchstart', () => setTimeout(handleExpand, 50), { passive: true });
}

async function loadNtms() {
  try {
    const response = await fetch(NTM_FEED_URL);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const ntms = await response.json();
    const today = new Date();

    ntms.forEach(item => {
      if (item.endDate && new Date(item.endDate) < today) {
        return;
      }

      ports.push({
        id: `ntm-${item.ntmNumber}`,
        lat: Number(item.latitude),
        lng: Number(item.longitude),
        name: `NtM ${item.ntmNumber} · ${item.title}`,
        kind: "ntm",
        layer: "ntm",
        type: "Notice to Mariners",
        shore: item.area || "Firth of Forth",
        chips: [
          item.ntmNumber,
          item.status,
          ...(Array.isArray(item.chips) ? item.chips : []),
        ].filter(Boolean),
        facts: [
          ["Status", item.status || ""],
          ["From", item.startDate || ""],
          ["Until", item.endDate || ""]
        ],
        body: (item.noticeText || "")
          .split(/\n\s*\n/)
          .map(p => `<p>${p}</p>`)
          .join(""),
        link: item.sourceUrl || "",
        linkLabel: "Official Notice"
      });
    });

    return true;
  } catch (err) {
    console.error("Unable to load NtM feed", err);
    return false; 
  }
}

    function layerOf(p) {
      if (p.layer) return p.layer;
      return "port";
    }
    function tagOf(p) {
      const l = layerOf(p);
      if (l === "club") return "CLUB";
      if (l === "event") return "RACE";
      if (l === "ntm") return "NtM";
      return p.kind === "major" ? "PORT" : "HBR";
    }
    function classOf(p) {
      const l = layerOf(p);
      if (l === "club") return "club";
      if (l === "event") return "event";
      if (l === "ntm") return "ntm";
      return p.kind === "major" ? "major" : "";
    }
    function visiblePlaces(q = "") {
      const query = q.trim().toLowerCase();
      return ports.filter(p => {
        const layer = layerOf(p);
        if (activeFilter === "visitor") {
          if (p.vbc !== "Yes") return false;
        } else if (activeFilter !== "all" && layer !== activeFilter) {
          return false;
        }
        if (!query) return true;
        return p.name.toLowerCase().includes(query);
        // const blob = [p.name, p.type, p.shore, ...(p.chips || [])].join(" ").toLowerCase();
        // return blob.includes(query);
      });
    }

    function iconFor(p, active) {
      const cls = "mk " + classOf(p) + (active ? " active" : "");
      return L.divIcon({
        className: cls,
        html: '<div class="dot"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
    }

function renderPins() {
  const q = document.getElementById("search").value;
  
  // 1. Get a list of IDs that *should* be visible based on current filters/search
  const visible = visiblePlaces(q);
  const visibleIds = new Set(visible.map(p => p.id));

  // 2. Loop through ALL loaded ports to add or remove markers dynamically
  ports.forEach(p => {
if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) {
    return;
}

    const isCurrentlyShowing = !!markers[p.id];
    const shouldBeShowing = visibleIds.has(p.id);

    if (shouldBeShowing && !isCurrentlyShowing) {
      // Create and add the marker if it's missing
      const m = L.marker([p.lat, p.lng], { icon: iconFor(p, false), title: p.name });
      m.on("click", () => openPort(p.id));
      
      if (showLabels) {
        m.bindTooltip(p.name, { permanent: true, direction: "right", className: "pin-label" });
      }
      
      m.addTo(map);
      markers[p.id] = m;

    } else if (!shouldBeShowing && isCurrentlyShowing) {
      // Remove the marker from the map if it shouldn't be showing
      map.removeLayer(markers[p.id]);
      delete markers[p.id];
      
    } else if (shouldBeShowing && isCurrentlyShowing) {
      // OPTIONAL: If the marker stays, ensure its tooltip state is updated 
      // (in case the global 'showLabels' toggle changed)
      if (showLabels && !markers[p.id].getTooltip()) {
        markers[p.id].bindTooltip(p.name, { permanent: true, direction: "right", className: "pin-label" });
      } else if (!showLabels && markers[p.id].getTooltip()) {
        markers[p.id].unbindTooltip();
      }
    }
  });
}

});



map.on("click", function (e) {
    // Only trigger auto-dismiss on mobile viewports
    if (window.innerWidth < 768) {
        
        // Leaflet maps use 'originalEvent' to expose standard DOM events.
        // If the click hit a leaflet pane container or a UI control, ignore it.
        const target = e.originalEvent.target;
        if (target.closest('.leaflet-marker-icon') || 
            target.closest('.leaflet-popup') || 
            target.closest('.leaflet-control')) {
            return; 
        }

        // Safe to dismiss panels since empty map canvas space was tapped
        closePanel();
        document.getElementById("filters").classList.remove("mobile-open");
        document.getElementById("listPanel").classList.remove("mobile-open");
    }
});

  </script>
